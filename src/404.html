<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Page Not Found :(</title>
    <style>
        body {
            max-height: 100vh;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        h1 {
            margin: 6rem 10px 0;
            font-size: 1.5 rem;
        }

        p {
            margin: 2rem 10px;
            color:#222222;
            font-size: 1rem;
        }

        a {
            color:#222222;
            text-decoration: underline;
            text-decoration-color:#0969da;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
        }

        a:hover {
            text-decoration-thickness: 3px;
        }

    </style>
  </head>
  <body>
    <h1>Error 404: Page Not Found :(</h1>
    <p>
        The requested page does not exist or has been moved. 
        [ <a href="/" class="home-link">Return home</a> ]
    </p>

    <div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="80 -20 340 220" width="100%" height="auto" style="max-width: 500px; display: block; margin: 2rem auto;">
            <style>.wall { fill: none; stroke: #e0e0e0; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .path { fill: none; stroke: #666666; stroke-width: 2; stroke-dasharray: 4,4; stroke-linecap: round; }
            .start-node { fill: #e0e0e0; }
            .dead-end { fill: #ff5f56; }
            .txt-main { fill: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; }
            .txt-sub { fill: #aaaaaa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-style: italic; }
            .txt-err { fill: #ff5f56; font-family: monospace; font-size: 14px; font-weight: bold; }
            </style>
            <!-- Labyrinth Outer Boundary -->
            <path d="M 210 20 L 330 20 L 330 120 " class="wall"/>
            <path d="M 330 150 L 170 150 L 170 20 " class="wall"/>
            <!-- Labyrinth Inner Walls -->
            <path d="M 210 20 L 210 100" class="wall"/>
            <path d="M 250 50 L 290 50 L 290 120" class="wall"/>
            <path d="M 250 100 L 250 150" class="wall"/>
            <!-- Start Point (Origin) -->
            <circle cx="190" cy="35" r="5" class="start-node"/>
            <!-- Breadcrumb Path through the Labyrinth -->
            <path d="M 190 35 L 190 135 L 230 135 L 230 75 L 270 75 L 270 135 L 310 135 L 310 35" class="path"/>
            <!-- Dead End Marker (404) -->
            <circle cx="310" cy="35" r="5" class="dead-end"/>
            <text x="310" y="10" text-anchor="middle" class="txt-err">404</text>
            <text x="250" y="180" text-anchor="middle" class="txt-sub">"Not all who wander are lost... but this page definitely is."</text>
        </svg>
    </div>





  </body>
</html>
