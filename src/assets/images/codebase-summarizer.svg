<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .gray-line { fill: #ffffff; stroke: #000000ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .gray-line-thin { fill: none; stroke: #a0aec0; stroke-width: 1.2; stroke-linecap: round; }
      .blue-line { fill: none; stroke: #0073ffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .blue-arrow { fill: none; stroke: #0073ffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .letter-w { font-family: "Georgia", "Times New Roman", serif; font-size: 34px; font-weight: bold; font-style: italic; fill: #0073ffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" class="bg" />

  <!-- LEFT: Codebase (Overlapping Files/Document Cards) -->
  <g id="codebase-cards">
    <!-- Back Card -->
    <rect x="40" y="45" width="60" height="85" rx="1" class="gray-line" />
    
    <!-- Middle Card -->
    <rect x="48" y="55" width="60" height="85" rx="1" class="gray-line" />
    
    <!-- Front Card with Abstract Code Lines -->
    <rect x="56" y="65" width="60" height="85" rx="1" class="gray-line" />
    
    <!-- Inside Front Card Lines -->
    <line x1="64" y1="77" x2="78" y2="77" class="gray-line-thin" />
    <line x1="64" y1="84" x2="94" y2="84" class="gray-line-thin" />
    <line x1="70" y1="91" x2="90" y2="91" class="gray-line-thin" />
    <line x1="64" y1="98" x2="84" y2="98" class="gray-line-thin" />
    <line x1="70" y1="105" x2="98" y2="105" class="gray-line-thin" />
    <line x1="64" y1="112" x2="80" y2="112" class="gray-line-thin" />
    <line x1="64" y1="119" x2="94" y2="119" class="gray-line-thin" />
    <line x1="64" y1="126" x2="74" y2="126" class="gray-line-thin" />
    <line x1="70" y1="133" x2="84" y2="133" class="gray-line-thin" />
  </g>

  <!-- FLOW INPUT: Funneling array of graceful lines into API point -->
  <g id="funnel-input">
    <path d="M 124 70 C 145 70, 145 92, 156 94" class="gray-line-thin" />
    <path d="M 124 88 C 142 88, 142 96, 156 98" class="gray-line-thin" />
    <path d="M 124 110 C 142 110, 142 104, 156 102" class="gray-line-thin" />
    <path d="M 124 128 C 145 128, 145 108, 156 106" class="gray-line-thin" />
    <line x1="124" y1="100" x2="156" y2="100" class="gray-line-thin" />
  </g>

  <!-- CENTER: API Node with W -->
  <g id="api-node">
    <circle cx="200" cy="100" r="32" class="bg" />
    <circle cx="200" cy="100" r="32" class="blue-line" />
    <text x="198" y="103" class="letter-w">W</text>
  </g>

  <!-- FLOW OUTPUT: Transformed arrow into text description -->
  <g id="flow-output">
    <line x1="236" y1="100" x2="274" y2="100" class="blue-arrow" />
    <path d="M 265 92 L 275 100 L 265 108" class="blue-arrow" />
  </g>

  <!-- RIGHT: Text Summary Document -->
  <g id="summary-doc">
    <rect x="294" y="55" width="68" height="95" rx="1.5" class="gray-line" />
    
    <!-- Doc Text (Abstract Block with Blue Accent Top Line) -->
    <line x1="304" y1="72" x2="352" y2="72" class="blue-line" />
    <line x1="304" y1="84" x2="352" y2="84" class="gray-line" />
    <line x1="304" y1="96" x2="344" y2="96" class="gray-line" />
    <line x1="304" y1="108" x2="348" y2="108" class="gray-line" />
    <line x1="304" y1="120" x2="348" y2="120" class="gray-line" />
    <line x1="304" y1="132" x2="334" y2="132" class="gray-line" />
  </g>
</svg>
